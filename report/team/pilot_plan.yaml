# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 2,48; n = 3.103 mỗi nhóm → cần ~42 người/nhóm (tổng 84 > 40): không đủ người
#   c) 20 nhân viên mỗi nhóm: tối đa c/ICC = 1.000 < 1.251: không đạt mức chênh 5 điểm
#   d) 6 depot mỗi nhóm: tối đa 300: không đạt; chỉ 6 cụm < 20
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m ≥ 299 yêu cầu/người (DE ≈ 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có — 20 nhân viên đối chứng cùng tuần, cùng depot
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên (bốc thăm bằng code, seed ghi trước, phân tầng theo depot)
#   3. Ảnh hưởng gián tiếp và cách giảm: Rủi ro chia sẻ câu trả lời trong depot; giảm bằng quyền theo tài khoản + log mở trợ lý theo staff_id
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có — chốt trước ngày bắt đầu pilot
#   5. Ít nhất 20 cụm mỗi nhóm: Có — đúng 20 nhân viên mỗi nhánh
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chọn chia theo nhân viên 20+20; chấp nhận MDE 6 điểm thay vì 5 (ở mức 5 điểm, power chỉ ~0,64 với n=859).
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Toàn mẫu 4,25% (51/1.200); phạm vi noi_dia+hang_nang 3,97% (39/982).
# D3 · Rollout và luật dừng:
#   Mở trợ lý theo 3 bước: 4 → 10 → 20 nhân viên treatment; giữ 20 nhân viên control cùng thời gian.
#   Chỉ dùng chỉ số chính để ra quyết định ở bước 20. Luật chênh lệch mở lại ≥2 điểm phần trăm
#   chỉ áp dụng từ bước 10 để tránh còi giả ở bước 4 (slide ước tính 56/1.000 so với 8/1.000).
#   Ở mọi bước, dừng ngay nếu mở lại >6%, có hoàn trùng, hoặc báo khách đã hoàn nhưng sổ cái không ghi thành công.
#   Ngưỡng CPS 8.000 đ là chi phí biến đổi (không gồm 40 triệu chi phí cố định); cố định được báo riêng
#   vì phân bổ trên lưu lượng nhỏ sẽ làm méo quyết định ở các bước rollout sớm.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (CPS 2.696 đ = 0,22× và 8.221 đ = 0,69× so với 12.000 đ, một phần simulated); loại quoc_te (22.515 đ = 1,88×) và doi_tac (10.215 đ = 0,85×)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout:
    - treatment_staff: 4
      control_staff: 20
      gate: "Kiểm tra sự cố an toàn tuyệt đối; chưa dùng chênh lệch mở lại ≥2 điểm hoặc chỉ số chính để quyết định"
    - treatment_staff: 10
      control_staff: 20
      gate: "Bắt đầu dùng ngưỡng chênh lệch mở lại ≥2 điểm so với đối chứng; tiếp tục kiểm tra sự cố tuyệt đối"
    - treatment_staff: 20
      control_staff: 20
      gate: "Đủ 20 cụm mỗi nhánh; bắt đầu đánh giá chỉ số chính theo kế hoạch"
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có — 20 nhân viên đối chứng chạy cùng thời gian, cùng depot"
    spillover_risk: "Rủi ro chia sẻ câu trả lời trong depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Chỉ số chính, MDE 6 điểm, luật dừng và ngày quyết định chốt trước ngày bắt đầu"
  stop_rules:
    - "NẾU trong lần kiểm tra an toàn hằng ngày, tỉ lệ mở lại của cohort đã đủ 7 ngày > 6%, hoặc có bất kỳ lệnh hoàn trùng / thông báo đã hoàn nhưng refund_ledger_write không thành công TRONG bất kỳ giao dịch nào THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước rollout tiếp"
    - "NẾU từ bước 10 nhân viên treatment trở đi, tỉ lệ mở lại cao hơn control ≥ 2 điểm phần trăm TRONG một kỳ interim look sau khi cohort đủ cửa sổ theo dõi 7 ngày THÌ Giám đốc vận hành dừng mở rộng và rà soát trong 1 ngày KHÔNG THÌ không được chuyển sang bước kế tiếp"
    - "NẾU CPS biến đổi (không gồm 40 triệu chi phí cố định) > 8.000 đ trong 2 tuần liên tiếp THÌ PM thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý > 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "Mỗi bước kiểm tra chỉ số an toàn tuyệt đối; chênh lệch mở lại ≥2 điểm áp dụng từ 10 nhân viên treatment; chỉ số chính chỉ được đánh giá ở bước 20 treatment + 20 control"
  rollback: "Giám đốc vận hành bấm cờ tắt, hiệu lực 30 phút; khách được phục vụ bằng luồng nhân viên tự làm"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "phut_xem_lai_simulated và phut_lam_lai_simulated trong CPS A2/A3/B"
    - "Giả định khối lượng 45.000 yêu cầu/tháng và chi phí cố định 40 triệu đ/tháng (A4)"
    - "Baseline 0,70 và MDE 0,06 cho cỡ mẫu D1 (không đo từ đối chứng trong đợt chạy thử)"
